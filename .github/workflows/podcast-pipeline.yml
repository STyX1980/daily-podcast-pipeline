name: Podcast Pipeline

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run audio pipeline (sync RSS with Dropbox audio folder)
        env:
          DROPBOX_APP_KEY:        ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET:     ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN:  ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_AUDIO_FOLDER:   ${{ secrets.DROPBOX_AUDIO_FOLDER }}
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_TITLE:          ${{ secrets.PODCAST_TITLE }}
          PODCAST_DESCRIPTION:    ${{ secrets.PODCAST_DESCRIPTION }}
          PODCAST_AUTHOR:         ${{ secrets.PODCAST_AUTHOR }}
          PODCAST_EMAIL:          ${{ secrets.PODCAST_EMAIL }}
          GH_REPO:                ${{ secrets.GH_REPO }}
          GH_PAGES_TOKEN:         ${{ secrets.GH_PAGES_TOKEN }}
        run: python scripts/pipeline.py

      - name: Save state files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add episode_metadata_cache.json || true
          git diff --staged --quiet || git commit -m "chore: update state [skip ci]"
          git push || true
